[package]
name = "agentbrowser-android"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agentbrowser-connection = { path = "../client-connection" }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
rcgen = "0.13"
uuid = { version = "1", features = ["v4"] }
